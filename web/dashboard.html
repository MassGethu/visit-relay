<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visit Relay dashboard</title>
  <meta name="description" content="Synthetic ASHA visits: danger flags, due visits and what to report to the ANM.">
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="dashboard.css">
  <script defer src="dashboard.js"></script>
  <script defer src="i18n.js"></script>
</head>
<body class="dash">
  <aside class="d-side" aria-label="Dashboard menu">
    <a class="d-brand" href="dashboard.html">
      <span class="d-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h4"/><path d="M18 8h2v11h-2"/></svg>
      </span>
      <span class="d-brand-text">
        <span class="d-brand-name">Visit Relay</span>
        <span class="d-brand-sub">Supervisor view</span>
      </span>
    </a>
    <nav id="nav" class="d-nav" aria-label="Sections"></nav>
    <div class="d-side-foot">
      <a class="d-side-link" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
        <span>Open visit register</span>
      </a>
      <p class="d-side-note">All patients here are made up.</p>
    </div>
  </aside>

  <div class="d-main">
    <header class="d-topbar">
      <nav class="d-crumbs" aria-label="Breadcrumb"><ol id="crumbs"></ol></nav>
      <div class="d-search" role="search">
        <div class="d-field">
          <svg class="d-glass" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" role="combobox" autocomplete="off" spellcheck="false" enterkeyhint="search"
            aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" aria-label="Search name, ID or village"
            placeholder="Search name, ID or village">
          <kbd class="d-kbd" aria-hidden="true">/</kbd>
          <button id="q-clear" class="d-clear" type="button" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <ul id="suggest" class="d-suggest" role="listbox" aria-label="Suggestions" hidden></ul>
      </div>
      <div class="d-top-right">
        <label class="d-lang"><span class="d-sr">Language</span>
          <select id="speech-language">
            <option value="hi">हिन्दी</option>
            <option value="kn">ಕನ್ನಡ</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
    </header>
    <main id="view" class="d-view" aria-live="polite">
      <p class="d-note">Loading…</p>
    </main>
  </div>
</body>
</html>
